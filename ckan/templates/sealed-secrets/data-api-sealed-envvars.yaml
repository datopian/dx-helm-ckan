{{- if and .Values.general.useSealedSecrets (and .Values.dataAPI.enable .Values.dataAPI.env) }}
{{- include "ckan.validateSealedData" (dict "data" .Values.dataAPI.env "path" "dataAPI.env") }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: "{{ .Values.general.projectId }}-data-api-envvars"
  {{- include "ckan.sealedSecretAnnotations" . | nindent 2 }}
spec:
  {{- with .Values.dataAPI.env }}
  encryptedData:
    {{ toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      name: "{{ .Values.general.projectId }}-data-api-envvars"
    type: Opaque
{{- end }}