{{- if and .Values.general.useSealedSecrets .Values.datapusher.env }}
{{- include "ckan.validateSealedData" (dict "data" .Values.datapusher.env "path" "datapusher.env") }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: "{{ .Values.general.projectId }}-datapusher-envvars"
  {{- include "ckan.sealedSecretAnnotations" . | nindent 2 }}
spec:
  {{- with .Values.datapusher.env }}
  encryptedData:
    {{ toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      name: "{{ .Values.general.projectId }}-datapusher-envvars"
    type: Opaque
{{- end }}