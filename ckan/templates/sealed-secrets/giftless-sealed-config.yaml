{{- if and .Values.general.useSealedSecrets (and .Values.giftless.enable .Values.giftless.env) }}
{{- include "ckan.validateSealedData" (dict "data" (dict "GIFTLESS_YAML_CONTENT" .Values.giftless.env.GIFTLESS_YAML_CONTENT) "path" "giftless.env") }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: "{{ .Values.general.projectId }}-giftless-config"
  {{- include "ckan.sealedSecretAnnotations" . | nindent 2 }}
spec:
  {{- with .Values.giftless.env }}
  encryptedData:
    giftless.yaml: {{ .GIFTLESS_YAML_CONTENT | quote }}
  {{- end }}
  template:
    metadata:
      name: "{{ .Values.general.projectId }}-giftless-config"
    type: Opaque
{{- end }}